push([1,"f:I[58217,[\"/_next/static/chunks/05-c3ty_6dwfk.js\",\"/_next/static/chunks/2im7c515bo69p.js\",\"/_next/static/chunks/04xkb2g5txm29.js\",\"/_next/static/chunks/3424pk-55bxe-.js\"],\"default\"]\n10:T1102,"])</script><script>self.__next_f.push([1,"# AI Agent 概述\n\n## 课程简介\n\nAI Agent（人工智能代理）是当前人工智能领域最热门的方向之一。与传统的聊天机器人不同，Agent 能够自主感知环境、做出决策、执行行动，并从中学习。本课时将带你了解 Agent 的核心概念、发展历程和分类方式。\n\n## 什么是 AI Agent\n\nAI Agent 是一个能够**自主行动**以达成目标的软件系统。它的核心特征包括：\n\n| 特征 | 说明 |\n|------|------|\n| **自主性** | 无需人类逐步指令，可自主决策 |\n| **感知能力** | 通过传感器或 API 获取环境信息 |\n| **行动能力** | 执行具体操作（调用 API、生成内容等） |\n| **目标导向** | 围绕特定目标进行规划和执行 |\n\n## Agent 的核心组件\n\n一个典型的 AI Agent 由以下四个核心组件构成：\n\n### 1. 大语言模型（LLM）\n\nLLM 是 Agent 的\"大脑\"，负责：\n- 理解用户意图\n- 生成推理过程\n- 做出决策\n- 生成自然语言回复\n\n### 2. 规划（Planning）\n\n规划能力让 Agent 能够将复杂任务分解为可执行的子任务：\n\n```\n用户请求：\"帮我策划一次去日本的旅行\"\n\nAgent 规划：\n  1. 查询日本热门旅游景点\n  2. 查询机票价格和航班信息\n  3. 查询酒店推荐\n  4. 整理行程建议\n  5. 生成旅行计划文档\n```\n\n### 3. 记忆（Memory）\n\n记忆系统让 Agent 能够：\n- **短期记忆**：记住当前对话的上下文\n- **长期记忆**：持久化用户偏好和历史信息\n- **工作记忆**：在复杂任务中跟踪中间状态\n\n### 4. 工具使用（Tool Use）\n\n工具使用让 Agent 超越纯文本生成：\n\n```python\n# Agent 可以调用的工具示例\ntools = [\n    {\"name\": \"search_web\", \"description\": \"搜索互联网\"},\n    {\"name\": \"calculator\", \"description\": \"执行数学计算\"},\n    {\"name\": \"send_email\", \"description\": \"发送邮件\"},\n    {\"name\": \"query_database\", \"description\": \"查询数据库\"},\n]\n```\n\n## Agent 的分类\n\n### 按自主程度分类\n\n| 类型 | 自主程度 | 示例 |\n|------|----------|------|\n| 反射 Agent | 低 | 简单规则引擎 |\n| 基于模型 Agent | 中 | 保留内部世界模型 |\n| 目标导向 Agent | 高 | 有明确目标和规划能力 |\n| 效用 Agent | 最高 | 基于效用函数做最优决策 |\n\n### 按架构分类\n\n| 架构 | 特点 | 代表 |\n|------|------|------|\n| ReAct | 推理与行动交替 | LangChain ReAct Agent |\n| Plan-and-Execute | 先规划后执行 | Plan-and-Solve |\n| MRKL | 模块化专家系统 | Google MRKL |\n| BabyAGI | 递归任务分解 | BabyAGI、AutoGPT |\n\n## Agent 的发展历程\n\n```\n2022 年之前：规则引擎 + 传统 NLP\n     |\n2022 年：ChatGPT 发布 → LLM 能力突破\n     |\n2023 年：LangChain 发布 → Agent 框架成熟\n     |\n2024 年：AutoGPT、CrewAI → 多 Agent 协作\n     |\n2025 年：Manus、OpenAI Operator → 计算机控制 Agent\n```\n\n## 代码示例：最简单的 Agent\n\n```python\n# 一个最简单的反射型 Agent\nclass SimpleAgent:\n    def __init__(self, llm):\n        self.llm = llm\n        self.memory = []\n\n    def perceive(self, user_input):\n        \"\"\"感知用户输入\"\"\"\n        self.memory.append({\"role\": \"user\", \"content\": user_input})\n        return user_input\n\n    def think(self, user_input):\n        \"\"\"思考：使用 LLM 生成响应\"\"\"\n        context = self._build_context()\n        response = self.llm.generate(context + \"\\nAssistant:\")\n        return response\n\n    def act(self, response):\n        \"\"\"行动：输出响应并更新记忆\"\"\"\n        self.memory.append({\"role\": \"assistant\", \"content\": response})\n        return response\n\n    def run(self, user_input):\n        perception = self.perceive(user_input)\n        thought = self.think(perception)\n        action = self.act(thought)\n        return action\n```\n\n## 练习任务\n\n1. 列举你日常生活中接触过的 Agent 系统\n2. 对比传统聊天机器人和 AI Agent 的三个核心区别\n3. 思考一个你希望 Agent 帮你解决的问题，分析需要哪些组件\n\n## 知识点总结\n\n- AI Agent = LLM + 规划 + 记忆 + 工具\n- 自主性和目标导向是 Agent 的核心特征\n- ReAct 是最主流的 Agent 架构模式\n- Agent 能力取决于 LLM 能力和工具集丰富度\n\n\u003e 提示：理解 Agent 的关键是区分\"生成文本\"和\"采取行动\"——Agent 不仅能说，还能做。\n"])</script><script>self.__next_f.push([1,"11:T1102,"])</script><script>self.__next_f.push([1,"# AI Agent 概述\n\n## 课程简介\n\nAI Agent（人工智能代理）是当前人工智能领域最热门的方向之一。与传统的聊天机器人不同，Agent 能够自主感知环境、做出决策、执行行动，并从中学习。本课时将带你了解 Agent 的核心概念、发展历程和分类方式。\n\n## 什么是 AI Agent\n\nAI Agent 是一个能够**自主行动**以达成目标的软件系统。它的核心特征包括：\n\n| 特征 | 说明 |\n|------|------|\n| **自主性** | 无需人类逐步指令，可自主决策 |\n| **感知能力** | 通过传感器或 API 获取环境信息 |\n| **行动能力** | 执行具体操作（调用 API、生成内容等） |\n| **目标导向** | 围绕特定目标进行规划和执行 |\n\n## Agent 的核心组件\n\n一个典型的 AI Agent 由以下四个核心组件构成：\n\n### 1. 大语言模型（LLM）\n\nLLM 是 Agent 的\"大脑\"，负责：\n- 理解用户意图\n- 生成推理过程\n- 做出决策\n- 生成自然语言回复\n\n### 2. 规划（Planning）\n\n规划能力让 Agent 能够将复杂任务分解为可执行的子任务：\n\n```\n用户请求：\"帮我策划一次去日本的旅行\"\n\nAgent 规划：\n  1. 查询日本热门旅游景点\n  2. 查询机票价格和航班信息\n  3. 查询酒店推荐\n  4. 整理行程建议\n     return action\n```\n\n## 练习任务\n\n1. 列举你日常生活中接触过的 Agent 系统\n2. 对比传统聊天机器人和 AI Agent 的三个核心区别\n3. 思考一个你希望 Agent 帮你解决的问题，分析需要哪些组件\n\n## 知识点总结\n\n- AI Agent = LLM + 规划 + 记忆 + 工具\n- 自主性和目标导向是 Agent 的核心特征\n- ReAct 是最主流的 Agent 架构模式\n- Agent 能力取决于 LLM 能力和工具集丰富度\n\n\u003e 提示：理解 Agent 的关键是区分\"生成文本\"和\"采取行动\"——Agent 不仅能说，还能做。\n"])</script><script>self.__next_f.push([1,"12:T109d,"])</script><script>self.__next_f.push([1,"# LLM 基础与 Prompt Engineering\n\n## 课程简介\n\n大语言模型（LLM）是 AI Agent 的\"大脑\"。本课时将深入了解 LLM 的工作原理，并学习如何通过 Prompt Engineering（提示工程）引导 LLM 产出高质量的回答。\n\n## 大语言模型基础\n\n### Transformer 架构\n\n现代 LLM 基于 Transformer 架构，核心组件包括：\n\n```\n输入文本 → Tokenization → Embedding → Transformer Blocks → Output Probabilities → 生成文本\n```\n\n### Token 的概念\n\nLLM 处理文本的基本单位是 Token：\n\n| 文本 | Token 数量 | 说明 |\n|------|-----------|------|\n| \"Hello\" | 1 | 英文单词通常对应 1 个 Token |\n| \"你好世界\" | 4 | 中文字通常每个字对应 1-2 个 Token |\n| \"PyTorch\" | 1-2 | 常见词通常是 1 个 Token |\n\n### 上下文窗口\n\n上下文窗口决定了 LLM 能\"看到\"多少内容：\n\n```\nGPT-4:      128K tokens (~300 页文本)\nClaude:     200K tokens (~500 页文本)\nGemini:     1M tokens (~3000 页文本)\n```\n\n## Prompt Engineering 核心技巧\n\n### 1. 角色设定\n\n给 LLM 分配一个明确的角色：\n\n```python\n# 不好的 Prompt\n\"解释 Python\"\n\n# 好的 Prompt\n\"你是一位拥有 10 年教学经验的 Python 讲师。\n请用通俗易懂的语言向初学者解释 Python 的列表推导式，\n并提供 3 个由浅入深的代码示例。\"\n```\n\n### 2. 任务分解\n\n将复杂任务拆分为清晰的步骤：\n\n```python\n# 不好的 Prompt\n\"帮我做一个网站\"\n\n# 好的 Prompt\n\"请帮我规划一个个人博客网站，分三个步骤：\n1. 列出需要实现的功能清单\n2. 推荐合适的技术栈\n3. 给出项目目录结构建议\"\n```\n\n### 3. 提供示例（Few-shot）\n\n让 LLM 通过示例理解期望的输出格式：\n\n```python\n# 不好的 Prompt\n\"把下面的句子翻译成英文\"\n\n# 好的 Prompt（Few-shot）\n\"将中文句子翻译成英文：\n\n示例 1：\n中文：今天天气真好\n英文：The weather is really nice today.\n\n示例 2：\n中文：我喜欢学习编程\n英文：I love learning programming.\n\n现在请翻译：\n中文：人工智能正在改变世界\n英文：\"\n```\n\n### 4. 输出格式控制\n\n明确指定输出的格式和结构：\n\n```python\nprompt = \"\"\"\n分析以下 Python 代码，按以下 JSON 格式输出：\n\n{\n    \"language\": \"语言名称\",\n    \"lines_of_code\": 行数,\n    \"functions\": [\"函数1\", \"函数2\"],\n    \"complexity\": \"低/中/高\",\n    \"suggestions\": [\"建议1\", \"建议2\"]\n}\n\n代码：\n```python\ndef fibonacci(n):\n    if n \u003c= 1:\n        return n\n    return fibonacci(n-1) + fibonacci(n-2)\n```\n\"\"\"\n```\n\n## 代码示例：Prompt 模板化\n\n```python\n# 构建可复用的 Prompt 模板\nclass PromptTemplate:\n    def __init__(self, template):\n        self.template = template\n\n    def format(self, **kwargs):\n        return self.template.format(**kwargs)\n\n# 定义模板\ncode_review_template = PromptTemplate(\"\"\"\n你是一位资深 Python 开发者。请 review 以下代码：\n\n代码：\n```python\n{code}\n```\n\n请从以下维度给出反馈：\n1. 代码风格（PEP 8 合规性）\n2. 潜在 Bug\n3. 性能优化建议\n4. 可读性改进\n\n请用中文回答。\n\"\"\")\n\n# 使用模板\nprompt = code_review_template.format(code=\"\"\"\ndef calc(a, b):\n    return a+b\n\"\"\")\n```\n\n## 常见的 Prompt 模式\n\n| 模式 | 用途 | 示例 |\n|------|------|------|\n| 零样本（Zero-shot） | 简单任务 | \"翻译这句话：你好\" |\n| 少样本（Few-shot） | 需要特定格式 | 提供 2-3 个示例 |\n| 思维链（CoT） | 推理任务 | \"让我们一步一步思考\" |\n| 自我一致性 | 提高准确率 | 多次生成，取多数答案 |\n| 角色扮演 | 专业领域 | \"你是一位医生...\" |\n\n## 练习任务\n\n1. 为一个\"Python 代码解释器\"角色编写 System Prompt\n2. 设计一个 Few-shot Prompt，让 LLM 将中文转换为特定的 JSON 格式\n3. 尝试用 CoT（思维链）Prompt 解决一个数学问题\n\n## 知识点总结\n\n- LLM 通过 Token 序列预测来生成文本\n- Prompt Engineering 的核心：角色、任务、示例、格式\n- 好的 Prompt = 清晰的角色 + 具体的任务 + 明确的输出格式\n- 善用模板化，提高 Prompt 复用性\n\n\u003e 提示：Prompt Engineering 的本质是\"与 LLM 的沟通艺术\"——越具体、越结构化，结果越可预期。\n"])</script><script>self.__next_f.push([1,"13:T189a,"])</script><script>self.__next_f.push([1,"# ReAct 推理框架\n\n## 课程简介\n\nReAct（Reasoning + Acting）是由 Google 在 2022 年提出的 Agent 推理框架。它的核心思想是让大语言模型交替进行**推理（Thought）**和**行动（Action）**，而不是像传统 Chain-of-Thought 那样只做推理，或者像传统 Agent 那样只做行动。\n\n## ReAct 的核心思想\n\n```\n传统 CoT（仅推理）：\n  Question → Thought → Thought → Answer\n\n传统 Agent（仅行动）：\n  Question → Action → Observation → Action → Answer\n\nReAct（推理 + 行动交替）：\n  Question → Thought → Action → Observation → Thought → Action → Observation → Answer\n```\n\n## ReAct 的工作流程\n\n以\"巴黎的法国大革命开始于哪一年？\"为例：\n\n```\nStep 1:\n  Thought: 我需要查找法国大革命开始的年份\n  Action: Search[\"法国大革命开始年份\"]\n  Observation: 法国大革命通常被认为开始于 1789 年\n\nStep 2:\n  Thought: 已获得答案，验证一下准确性\n  Action: Finish[1789]\n```\n\n## ReAct 的 Prompt 模板\n\n```python\nREACT_PROMPT = \"\"\"\n你是一个智能助手，可以思考和行动。\n\n每次回复包含以下部分：\n1. Thought: 你的思考过程\n2. Action: 要执行的操作（搜索/计算/查询等）\n3. Action Input: 操作所需的输入\n4. Observation: 观察到的结果（由系统提供）\n5. 当你有足够信息时输出：Final Answer: [你的答案]\n\n可用工具：\n- Search[query]: 搜索互联网获取信息\n- Calculator[expr]: 执行数学计算\n- Lookup[key]: 从知识库中查找信息\n\n问题：{question}\n\n让我们开始：\n\"\"\"\n```\n\n## 代码示例：实现一个 ReAct Agent\n\n```python\nimport re\nimport json\n\nclass ReActAgent:\n    \"\"\"基于 ReAct 框架的简单 Agent\"\"\"\n\n    def __init__(self, llm, tools):\n        self.llm = llm\n        self.tools = {tool[\"name\"]: tool for tool in tools}\n        self.max_steps = 5\n\n    def _parse_output(self, text):\n        \"\"\"解析 LLM 输出，提取 Thought、Action、Action Input\"\"\"\n        thought_match = re.search(r\"Thought: (.+)\", text)\n        action_match = re.search(r\"Action: (.+)\", text)\n        input_match = re.search(r\"Action Input: (.+)\", text)\n        answer_match = re.search(r\"Final Answer: (.+)\", text)\n\n        return {\n            \"thought\": thought_match.group(1) if thought_match else None,\n            \"action\": action_match.group(1) if action_match else None,\n            \"action_input\": input_match.group(1) if input_match else None,\n            \"answer\": answer_match.group(1) if answer_match else None,\n        }\n\n    def _execute_action(self, action_name, action_input):\n        \"\"\"执行工具调用\"\"\"\n        if action_name not in self.tools:\n            return f\"错误：未知工具 {action_name}\"\n\n        tool = self.tools[action_name]\n        if tool[\"type\"] == \"search\":\n            return f\"搜索结果：{action_input} 的相关信息...\"\n        elif tool[\"type\"] == \"calculator\":\n            try:\n                result = eval(action_input)\n                return f\"计算结果：{result}\"\n            except:\n                return \"计算错误：无效的表达式\"\n        elif tool[\"type\"] == \"lookup\":\n            knowledge = {\n                \"法国大革命\": \"1789 年开始\",\n                \"美国独立\": \"1776 年\",\n                \"工业革命\": \"18 世纪 60 年代\",\n            }\n            return knowledge.get(action_input, \"知识库中未找到该信息\")\n\n        return \"未知工具类型\"\n\n    def run(self, question):\n        \"\"\"运行 ReAct 循环\"\"\"\n        prompt = f\"\"\"你是一个智能助手，可以思考和行动。\n\n可用工具：Search, Calculator, Lookup\n\n问题：{question}\n\n让我们开始一步一步思考：\"\"\"\n\n        for step in range(self.max_steps):\n            response = self.llm.generate(prompt + f\"\\n\\nStep {step + 1}:\\nThought:\")\n            parsed = self._parse_output(response)\n\n            if parsed[\"answer\"]:\n                return parsed[\"answer\"]\n\n            if parsed[\"action\"] and parsed[\"action_input\"]:\n                observation = self._execute_action(\n                    parsed[\"action\"].strip(),\n                    parsed[\"action_input\"].strip()\n                )\n                prompt += f\"\\nThought: {parsed['thought']}\\n\"\n                prompt += f\"Action: {parsed['action']}\\n\"\n                prompt += f\"Action Input: {parsed['action_input']}\\n\"\n                prompt += f\"Observation: {observation}\\n\"\n\n        return \"达到最大步数，未能得出结论\"\n\n\n# 使用示例\ntools = [\n    {\"name\": \"Search\", \"type\": \"search\", \"description\": \"搜索互联网\"},\n    {\"name\": \"Calculator\", \"type\": \"calculator\", \"description\": \"数学计算\"},\n    {\"name\": \"Lookup\", \"type\": \"lookup\", \"description\": \"知识库查询\"},\n]\n\n# agent = ReActAgent(llm=your_llm, tools=tools)\n# answer = agent.run(\"法国大革命开始于哪一年？\")\n```\n\n## ReAct vs 其他框架对比\n\n| 框架 | 推理方式 | 行动方式 | 适用场景 |\n|------|----------|----------|----------|\n| **ReAct** | Thought + Action 交替 | 工具调用 | 通用任务 |\n| CoT | 连续推理 | 无 | 数学/逻辑推理 |\n| ToT | 多路径探索 | 无 | 复杂规划问题 |\n| Reflexion | 推理 + 自我反思 | 工具调用 | 需要迭代改进的任务 |\n\n## ReAct 的优缺点\n\n### 优点\n- **可解释性强**：Thought 过程透明可见\n- **纠错能力**：通过 Observation 发现错误并修正\n- **灵活性强**：支持任意工具组合\n\n### 缺点\n- **消耗 Token 多**：Thought + Action + Observation 三段式输出\n- **不稳定**：LLM 可能不遵循格式要求\n- **速度慢**：多步推理增加响应时间\n\n## 练习任务\n\n1. 设计一个 ReAct Agent，能够回答\"今天几号\"这类日期问题（使用 Calculator 工具）\n2. 尝试在 ReAct Prompt 中加入 \"Let's think step by step\" 观察效果差异\n3. 对比 ReAct 和纯 CoT 在复杂推理任务上的表现\n\n## 知识点总结\n\n- ReAct = Reasoning（推理）+ Acting（行动）交替进行\n- 每步输出：Thought → Action → Observation\n- ReAct Prompt 需要明确指定输出格式\n- 相比 CoT，ReAct 更适合需要外部信息的任务\n\n\u003e 提示：ReAct 的精髓在于\"边想边做\"——不要等想清楚了再行动，而是在行动中不断验证和修正思考。\n"])</script><script>self.__next_f.push([1,"14:T1b3c,"])</script><script>self.__next_f.push([1,"# 工具调用与 Function Calling\n\n## 课程简介\n\n工具使用（Tool Use）是 AI Agent 超越纯文本生成的关键能力。通过 Function Calling，LLM 可以输出结构化的工具调用请求，让 Agent 具备与外部世界交互的能力——查询数据库、发送邮件、操作 API 等。\n\n## 什么是 Function Calling\n\nFunction Calling 是 LLM 提供商（OpenAI、Anthropic 等）提供的一种能力，允许开发者：\n\n1. **定义工具**：向 LLM 描述可用工具的参数和用途\n2. **自动选择**：LLM 根据用户请求自动判断是否需要调用工具\n3. **生成参数**：LLM 自动提取调用所需的参数\n4. **执行调用**：开发者代码执行工具，返回结果给 LLM\n\n## 工具定义\n\n### OpenAI 格式\n\n```python\ntools = [\n    {\n        \"type\": \"function\",\n        \"function\": {\n            \"name\": \"get_weather\",\n            \"description\": \"获取指定城市的当前天气\",\n            \"parameters\": {\n                \"type\": \"object\",\n                \"properties\": {\n                    \"city\": {\n                        \"type\": \"string\",\n                        \"description\": \"城市名称，如：北京、上海\"\n                    },\n                    \"unit\": {\n                        \"type\": \"string\",\n                        \"enum\": [\"celsius\", \"fahrenheit\"],\n                        \"description\": \"温度单位\"\n                    }\n                },\n                \"required\": [\"city\"]\n            }\n        }\n    }\n]\n```\n\n### Anthropic (Claude) 格式\n\n```python\ntools = [\n    {\n        \"name\": \"get_weather\",\n        \"description\": \"获取指定城市的当前天气\",\n        \"input_schema\": {\n            \"type\": \"object\",\n            \"properties\": {\n                \"city\": {\n                    \"type\": \"string\",\n                    \"description\": \"城市名称\"\n                },\n                \"unit\": {\n                    \"type\": \"string\",\n                    \"enum\": [\"celsius\", \"fahrenheit\"],\n                    \"description\": \"温度单位\"\n                }\n            },\n            \"required\": [\"city\"]\n        }\n    }\n]\n```\n\n## 完整的 Function Calling 流程\n\n```python\nimport json\n\nclass FunctionCallingAgent:\n    \"\"\"支持 Function Calling 的 Agent\"\"\"\n\n    def __init__(self, llm_client, tools):\n        self.llm = llm_client\n        self.tools = {t[\"name\"]: t for t in tools}\n\n    def call_llm(self, messages):\n        \"\"\"调用 LLM API\"\"\"\n        response = self.llm.chat.completions.create(\n            model=\"gpt-4\",\n            messages=messages,\n            tools=self._format_tools(),\n            tool_choice=\"auto\",\n        )\n        return response.choices[0].message\n\n    def _format_tools(self):\n        \"\"\"格式化工具定义\"\"\"\n        return [\n            {\n                \"type\": \"function\",\n                \"function\": {\n                    \"name\": tool[\"name\"],\n                    \"description\": tool[\"description\"],\n                    \"parameters\": tool[\"parameters\"],\n                }\n            }\n            for tool in self.tools.values()\n        ]\n\n    def execute_tool(self, tool_call):\n        \"\"\"执行工具调用\"\"\"\n        func_name = tool_call.function.name\n        func_args = json.loads(tool_call.function.arguments)\n\n        if func_name not in self.tools:\n            return f\"错误：未知工具 {func_name}\"\n\n        if func_name == \"get_weather\":\n            return self._get_weather(func_args[\"city\"], func_args.get(\"unit\", \"celsius\"))\n        elif func_name == \"search_web\":\n            return self._search_web(func_args[\"query\"])\n        elif func_name == \"send_email\":\n            return self._send_email(func_args[\"to\"], func_args[\"subject\"], func_args[\"body\"])\n\n        return \"未知工具\"\n\n    def run(self, user_message):\n        \"\"\"运行 Agent 循环\"\"\"\n        messages = [{\"role\": \"user\", \"content\": user_message}]\n\n        while True:\n            response = self.call_llm(messages)\n            messages.append(response)\n\n            if not response.tool_calls:\n                return response.content\n\n            for tool_call in response.tool_calls:\n                result = self.execute_tool(tool_call)\n                messages.append({\n                    \"role\": \"tool\",\n                    \"tool_call_id\": tool_call.id,\n                    \"content\": result,\n                })\n\n            continue\n```\n\n## 并行工具调用\n\n现代 LLM 支持一次请求中并行调用多个工具：\n\n```python\n# 用户问：\"北京和上海的天气怎么样？\"\n\n# LLM 可能同时发起两个工具调用：\ntool_calls = [\n    {\"name\": \"get_weather\", \"args\": {\"city\": \"北京\"}},\n    {\"name\": \"get_weather\", \"args\": {\"city\": \"上海\"}},\n]\n\n# 并行执行\nresults = [get_weather(tc[\"args\"]) for tc in tool_calls]\n```\n\n## 工具设计最佳实践\n\n### 1. 清晰的描述\n\n```python\n# 不好\n{\"name\": \"search\", \"description\": \"搜索\"}\n\n# 好\n{\"name\": \"search_web\",\n \"description\": \"使用搜索引擎搜索互联网上的信息。适用于需要获取最新信息、事实数据或外部知识的问题。\"}\n```\n\n### 2. 合理的参数约束\n\n```python\n{\"name\": \"send_email\", \"parameters\": {\n    \"type\": \"object\",\n    \"properties\": {\n        \"to\": {\"type\": \"string\", \"format\": \"email\"},\n        \"priority\": {\n            \"type\": \"string\",\n            \"enum\": [\"low\", \"normal\", \"high\"],\n        }\n    },\n    \"required\": [\"to\"]\n}}\n```\n\n### 3. 错误处理\n\n```python\ndef safe_execute_tool(tool_name, args):\n    try:\n        result = execute_tool(tool_name, args)\n        return {\"status\": \"success\", \"data\": result}\n    except ValidationError as e:\n        return {\"status\": \"error\", \"message\": f\"参数错误：{e}\"}\n    except TimeoutError:\n        return {\"status\": \"error\", \"message\": \"工具调用超时\"}\n    except Exception as e:\n        return {\"status\": \"error\", \"message\": f\"内部错误：{str(e)}\"}\n```\n\n## 安全注意事项\n\n| 风险 | 缓解措施 |\n|------|----------|\n| 恶意 Prompt 注入 | 在工具层做参数验证，不信任 LLM 输出 |\n| 敏感数据泄露 | 工具不返回 API key、密码等敏感信息 |\n| 过度授权 | 最小权限原则，每个工具只给必要权限 |\n| 无限循环 | 设置最大工具调用次数上限 |\n\n## 练习任务\n\n1. 定义一个\"计算器\"工具，支持加减乘除，写出完整的工具定义 JSON\n2. 实现一个简单的工具路由器，根据 LLM 返回的 tool_calls 分发到对应的 Python 函数\n3. 设计 3 个工具，让 Agent 能够完成\"帮我订一杯咖啡\"的任务\n\n## 知识点总结\n\n- Function Calling 让 LLM 从\"文本生成器\"变成\"行动者\"\n- 工具定义需要清晰的名称、描述和参数 schema\n- Agent 循环：LLM 判断 → 执行工具 → 返回结果 → LLM 总结\n- 安全第一：永远不要信任 LLM 生成的参数，工具层必须做验证\n\n\u003e 提示：Function Calling 的本质是\"用 LLM 做路由\"——让 LLM 理解用户意图后，自动选择正确的工具并提取参数。\n"])</script><script>self.__next_f.push([1,"15:T23ce,"])</script><script>self.__next_f.push([1,"# 记忆系统\n\n## 课程简介\n\n记忆是人类智能的核心能力之一——我们能够回忆起过去的对话、记住用户的偏好、从经验中学习。AI Agent 同样需要记忆系统来维持连续性和个性化。本课时将学习如何为 Agent 设计和管理记忆系统。\n\n## 记忆的分类\n\n### 1. 短期记忆（Short-term Memory）\n\n等同于人类的\"工作记忆\"——当前对话的上下文。\n\n```python\n# 短期记忆实现：消息列表\nshort_term_memory = [\n    {\"role\": \"system\", \"content\": \"你是一个 helpful assistant\"},\n    {\"role\": \"user\", \"content\": \"我叫小明\"},\n    {\"role\": \"assistant\", \"content\": \"你好，小明！\"},\n    {\"role\": \"user\", \"content\": \"我喜欢 Python\"},\n    {\"role\": \"assistant\", \"content\": \"Python 是个很棒的选择！\"},\n]\n```\n\n**特点**：\n- 容量有限（受 LLM 上下文窗口限制）\n- 临时性（对话结束即丢失）\n- 高保真（包含完整细节）\n\n### 2. 长期记忆（Long-term Memory）\n\n等同于人类的\"长期记忆\"——持久化的知识和经历。\n\n```python\n# 长期记忆实现：键值存储\nlong_term_memory = {\n    \"user_profile\": {\n        \"name\": \"小明\",\n        \"age\": 28,\n        \"interests\": [\"Python\", \"AI\", \"摄影\"],\n        \"learning_goals\": [\"构建 AI Agent\", \"学习 FastAPI\"],\n    },\n    \"conversation_history\": [\n        {\"date\": \"2025-01-10\", \"topic\": \"Python 基础\", \"summary\": \"学习了变量和函数\"},\n        {\"date\": \"2025-01-12\", \"topic\": \"FastAPI 入门\", \"summary\": \"搭建了第一个 API\"},\n    ],\n    \"knowledge_base\": {\n        \"python_tips\": [\"用列表推导式代替 for 循环\", \"用 f-string 格式化字符串\"],\n        \"common_mistakes\": [\"忘记处理 None\", \"混淆 == 和 is\"],\n    }\n}\n```\n\n**特点**：\n- 容量无限（受存储限制）\n- 持久化（跨会话保留）\n- 需要摘要（不能全量塞入上下文）\n\n### 3. 工作记忆（Working Memory）\n\nAgent 在解决复杂任务时的\"草稿纸\"——追踪中间步骤。\n\n```python\n# 工作记忆实现：任务追踪\nworking_memory = {\n    \"current_task\": \"规划东京旅行\",\n    \"sub_tasks\": [\n        {\"id\": 1, \"desc\": \"查询机票\", \"status\": \"completed\", \"result\": \"往返 ¥3500\"},\n        {\"id\": 2, \"desc\": \"查询酒店\", \"status\": \"in_progress\"},\n        {\"id\": 3, \"desc\": \"规划行程\", \"status\": \"pending\"},\n        {\"id\": 4, \"desc\": \"整理文档\", \"status\": \"pending\"},\n    ],\n    \"decisions\": [\"选择春秋航空（便宜）\", \"选择新宿地区酒店（交通便利）\"],\n    \"constraints\": [\"预算 5000 元\", \"7 天行程\", \"偏好文化景点\"],\n}\n```\n\n## 记忆管理策略\n\n### 信息摘要（Summarization）\n\n当对话过长时，需要压缩记忆：\n\n```python\ndef summarize_memory(messages, max_tokens=2000):\n    \"\"\"将长对话压缩为摘要\"\"\"\n    prompt = f\"\"\"请将以下对话压缩为简洁的摘要，保留关键信息：\n\n对话内容：\n{format_messages(messages)}\n\n摘要要求：\n- 保留用户的核心需求和偏好\n- 保留 Agent 做出的重要决策\n- 省略重复和无关内容\n- 控制在 {max_tokens} tokens 以内\n\n摘要：\"\"\"\n\n    summary = llm.generate(prompt)\n    return summary\n```\n\n### 记忆检索（Retrieval）\n\n从长期记忆中检索相关信息：\n\n```python\nclass MemoryRetriever:\n    \"\"\"基于关键词的简单记忆检索\"\"\"\n\n    def __init__(self, memory_store):\n        self.store = memory_store\n\n    def search(self, query, top_k=3):\n        \"\"\"根据查询检索相关记忆\"\"\"\n        results = []\n        for key, value in self.store.items():\n            score = self._similarity(query, str(value))\n            if score \u003e 0.3:\n                results.append({\"key\": key, \"value\": value, \"score\": score})\n\n        results.sort(key=lambda x: x[\"score\"], reverse=True)\n        return results[:top_k]\n\n    def _similarity(self, query, text):\n        \"\"\"简单的关键词匹配相似度\"\"\"\n        query_words = set(query.lower().split())\n        text_words = set(text.lower().split())\n        if not query_words:\n            return 0\n        return len(query_words \u0026 text_words) / len(query_words)\n```\n\n### 记忆遗忘（Forgetting）\n\n不是所有记忆都值得保留：\n\n```python\ndef forget_old_memories(memory, days_to_keep=30):\n    \"\"\"清理过期的短期记忆\"\"\"\n    cutoff = datetime.now() - timedelta(days=days_to_keep)\n    memory[\"short_term\"] = [\n        msg for msg in memory[\"short_term\"]\n        if datetime.fromisoformat(msg.get(\"timestamp\", \"\")) \u003e cutoff\n    ]\n    return memory\n```\n\n## 向量数据库存储\n\n对于大量长期记忆，使用向量数据库进行语义检索：\n\n```\n记忆存储流程：\n  文本 → Embedding 模型 → 向量 → 向量数据库 (Pinecone/Chroma/Qdrant)\n                                                     │\n检索流程：                                        │\n  查询 → Embedding → 向量相似度搜索 ← ← ← ← ← ← ← ┘\n       → 返回最相关的记忆片段\n```\n\n```python\n# 使用 Chroma 存储记忆\nimport chromadb\n\nclient = chromadb.PersistentClient(path=\"./agent_memory\")\ncollection = client.get_or_create_collection(\"long_term_memory\")\n\ndef store_memory(text, metadata=None):\n    \"\"\"存储一段记忆\"\"\"\n    embedding = embedding_model.encode(text).tolist()\n    collection.add(\n        documents=[text],\n        embeddings=[embedding],\n        metadatas=[metadata or {}],\n        ids=[str(uuid.uuid4())],\n    )\n\ndef recall_memory(query, top_k=5):\n    \"\"\"检索相关记忆\"\"\"\n    query_embedding = embedding_model.encode(query).tolist()\n    results = collection.query(\n        query_embeddings=[query_embedding],\n        n_results=top_k,\n    )\n    return results[\"documents\"][0]\n```\n\n## 完整的记忆系统架构\n\n```\n┌─────────────────────────────────────────────────────────┐\n│                    Agent 记忆系统                          │\n├─────────────────────────────────────────────────────────┤\n│                                                         │\n│  输入 → ┌─────────────┐    ┌──────────────┐            │\n│         │ 短期记忆     │    │ 长期记忆      │            │\n│         │ (对话上下文) │    │ (向量数据库)  │            │\n│         └──────┬──────┘    └──────┬───────┘            │\n│                │                  │                      │\n│                ▼                  ▼                      │\n│         ┌─────────────┐    ┌──────────────┐            │\n│         │ Token 压缩   │    │ 语义检索      │            │\n│         │ (超长时)     │    │ (相关性匹配)  │            │\n│         └──────┬──────┘    └──────┬───────┘            │\n│                │                  │                      │\n│                └────────┬─────────┘                     │\n│                         ▼                               │\n│                  ┌─────────────┐                        │\n│                  │ 上下文组装   │                        │\n│                  │ (系统提示+   │                        │\n│                  │  相关记忆+   │                        │\n│                  │  当前输入)   │                        │\n│                  └──────┬──────┘                        │\n│                         ▼                               │\n│                  ┌─────────────┐                        │\n│                  │ LLM 推理     │                        │\n│                  └─────────────┘                        │\n│                                                         │\n└─────────────────────────────────────────────────────────┘\n```\n\n## 练习任务\n\n1. 实现一个简单的记忆管理器，支持 `remember()` 和 `recall()` 两个方法\n2. 为你的 Agent 添加\"用户偏好\"记忆，让它在后续对话中记住用户喜欢的内容格式\n3. 设计一个记忆摘要策略，当对话超过 20 轮时自动压缩早期内容\n\n## 知识点总结\n\n- 短期记忆 = 对话上下文（有限、临时）\n- 长期记忆 = 持久化知识（无限、需要检索）\n- 工作记忆 = 任务中间状态（随任务结束清空）\n- 记忆管理核心：摘要（压缩）+ 检索（相关性）+ 遗忘（清理）\n\n\u003e 💡 提示：好的记忆系统不是记住一切，而是在正确的时间把正确的信息呈现给 LLM。\n"])</script><script>self.__next_f.push([1,"16:T26ca,"])</script><script>self.__next_f.push([1,"# RAG 检索增强生成\n\n## 课程简介\n\nRAG（Retrieval-Augmented Generation，检索增强生成）是当前 AI Agent 最核心的技术之一。它通过从外部知识库中检索相关信息，增强 LLM 的回答质量和时效性。本课时将深入学习 RAG 的原理、架构和实现方法。\n\n## 为什么需要 RAG\n\n### LLM 的固有局限\n\n| 问题 | 说明 | RAG 解决方案 |\n|------|------|-------------|\n| 知识截止 | 训练数据有截止日期 | 检索最新的文档 |\n| 幻觉问题 | LLM 可能生成不准确的信息 | 基于检索到的原文回答 |\n| 领域知识 | 通用 LLM 缺乏专业知识 | 注入领域文档 |\n| 隐私数据 | 不能将敏感数据用于训练 | 仅检索不暴露原始数据 |\n\n## RAG 架构\n\n```\n┌──────────────────────────────────────────────────────────┐\n│                      RAG 系统架构                          │\n├──────────────────────────────────────────────────────────┤\n│                                                          │\n│  ┌──────────┐    ┌──────────┐    ┌──────────┐          │\n│  │ 文档加载  │───►│ 文档切分  │───►│ Embedding│          │\n│  │ (Loader) │    │(Splitter) │    │ (向量化) │          │\n│  └──────────┘    └──────────┘    └────┬─────┘          │\n│                                      │                   │\n│                                      ▼                   │\n│                              ┌──────────────┐           │\n│                              │ 向量数据库    │           │\n│                              │ (Vector DB)  │           │\n│                              └──────┬───────┘           │\n│                                     │                    │\n│  ┌──────────┐    ┌──────────┐       │    ┌──────────┐  │\n│  │ 用户查询  │───►│ 查询向量化│◄──────┘    │  LLM 生成  │  │\n│  │ (Query)  │    │ + 检索   │             │ + 上下文   │  │\n│  └──────────┘    └──────────┘             └──────────┘  │\n│                                                          │\n└──────────────────────────────────────────────────────────┘\n```\n\n## 代码示例：完整 RAG 实现\n\n```python\nfrom typing import List, Dict\nimport numpy as np\n\nclass SimpleRAG:\n    \"\"\"简化版 RAG 系统\"\"\"\n\n    def __init__(self, embedding_dim=128):\n        self.documents = []      # 文档库\n        self.embeddings = []     # 文档向量\n        self.embedding_dim = embedding_dim\n\n    def add_documents(self, docs: List[str]):\n        \"\"\"添加文档到知识库\"\"\"\n        for doc in docs:\n            self.documents.append(doc)\n            embedding = self._simple_embed(doc)\n            self.embeddings.append(embedding)\n\n    def _simple_embed(self, text: str) -\u003e List[float]:\n        \"\"\"简单的词袋模型嵌入（生产环境应使用 sentence-transformers）\"\"\"\n        # 基于字符频率的简单嵌入\n        vocab = {}\n        for char in set(text):\n            vocab[char] = text.count(char) / len(text)\n\n        embedding = [0.0] * self.embedding_dim\n        for i, char in enumerate(sorted(vocab.keys())):\n            if i \u003c self.embedding_dim:\n                embedding[i] = vocab[char]\n        return embedding\n\n    def _cosine_similarity(self, a, b):\n        \"\"\"计算余弦相似度\"\"\"\n        a, b = np.array(a), np.array(b)\n        return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))\n\n    def retrieve(self, query: str, top_k: int = 3) -\u003e List[Dict]:\n        \"\"\"检索最相关的文档片段\"\"\"\n        query_embedding = self._simple_embed(query)\n\n        scores = []\n        for i, doc_embedding in enumerate(self.embeddings):\n            score = self._cosine_similarity(query_embedding, doc_embedding)\n            scores.append({\n                \"index\": i,\n                \"score\": score,\n                \"content\": self.documents[i],\n            })\n\n        scores.sort(key=lambda x: x[\"score\"], reverse=True)\n        return scores[:top_k]\n\n    def generate_response(self, query: str, llm) -\u003e str:\n        \"\"\"RAG 生成回答\"\"\"\n        # 1. 检索相关文档\n        relevant_docs = self.retrieve(query, top_k=3)\n\n        # 2. 构建增强 Prompt\n        context = \"\\n\\n\".join([\n            f\"[参考 {i+1}]: {doc['content']}\"\n            for i, doc in enumerate(relevant_docs)\n        ])\n\n        prompt = f\"\"\"基于以下参考信息回答问题。如果参考信息中没有答案，请明确说明。\n\n参考信息：\n{context}\n\n问题：{query}\n\n回答：\"\"\"\n\n        # 3. 让 LLM 生成回答\n        response = llm.generate(prompt)\n        return response\n\n\n# 使用示例\nknowledge_base = [\n    \"Python 是一种高级编程语言，由 Guido van Rossum 于 1991 年创建。\",\n    \"Python 的设计哲学强调代码的可读性和简洁性。\",\n    \"Python 支持多种编程范式：面向对象、函数式、过程式。\",\n    \"Python 的标准库非常丰富，包括网络、数据库、GUI 等模块。\",\n    \"Python 是数据科学和人工智能领域最流行的语言之一。\",\n    \"Django 和 Flask 是 Python 最流行的 Web 框架。\",\n    \"Python 的 GIL（全局解释器锁）限制了多线程 CPU 密集型任务的性能。\",\n]\n\nrag = SimpleRAG()\nrag.add_documents(knowledge_base)\n\n# 查询\nquery = \"Python 是谁创建的？有什么特点？\"\nresults = rag.retrieve(query)\nprint(\"检索到的相关内容:\")\nfor r in results:\n    print(f\"  [{r['score']:.3f}] {r['content']}\")\n```\n\n## 文档切分策略\n\n```python\nclass DocumentSplitter:\n    \"\"\"文档切分器\"\"\"\n\n    def split_by_chars(self, text, chunk_size=500, overlap=50):\n        \"\"\"按字符数切分\"\"\"\n        chunks = []\n        start = 0\n        while start \u003c len(text):\n            end = start + chunk_size\n            chunk = text[start:end]\n            chunks.append(chunk)\n            start = end - overlap  # 重叠区域保证上下文连续性\n        return chunks\n\n    def split_by_tokens(self, text, chunk_size=100, overlap=10):\n        \"\"\"按 Token 数切分（更精确）\"\"\"\n        tokens = text.split()\n        chunks = []\n        start = 0\n        while start \u003c len(tokens):\n            end = start + chunk_size\n            chunk = \" \".join(tokens[start:end])\n            chunks.append(chunk)\n            start = end - overlap\n        return chunks\n\n    def split_by_semantic(self, text):\n        \"\"\"按语义边界切分（按段落/标题）\"\"\"\n        # 按 Markdown 标题切分\n        sections = []\n        current_section = \"\"\n        for line in text.split(\"\\n\"):\n            if line.startswith(\"#\"):\n                if current_section:\n                    sections.append(current_section.strip())\n                current_section = line + \"\\n\"\n            else:\n                current_section += line + \"\\n\"\n        if current_section:\n            sections.append(current_section.strip())\n        return sections\n```\n\n## 向量数据库选型\n\n| 数据库 | 特点 | 适用场景 |\n|--------|------|----------|\n| **Chroma** | 轻量、易用、Python 原生 | 原型开发、小规模应用 |\n| **Pinecone** | 托管服务、高可用 | 生产环境、大规模 |\n| **Qdrant** | 开源、高性能、Rust 编写 | 自托管、高性能需求 |\n| **Weaviate** | 模块化、支持混合搜索 | 企业级应用 |\n| **FAISS** | Meta 开源、极致性能 | 离线大规模检索 |\n\n## 高级 RAG 技术\n\n### 1. 混合搜索（Hybrid Search）\n\n结合向量搜索和关键词搜索：\n\n```python\ndef hybrid_search(query, vector_db, keyword_index, alpha=0.5):\n    \"\"\"混合搜索：向量相似度 + 关键词匹配\"\"\"\n    # 向量搜索\n    vector_results = vector_db.search(query, top_k=10)\n\n    # 关键词搜索\n    keyword_results = keyword_index.search(query, top_k=10)\n\n    # 融合排序（ Reciprocal Rank Fusion）\n    scores = {}\n    for rank, result in enumerate(vector_results):\n        scores[result[\"id\"]] = scores.get(result[\"id\"], 0) + alpha * (1 / (rank + 1))\n    for rank, result in enumerate(keyword_results):\n        scores[result[\"id\"]] = scores.get(result[\"id\"], 0) + (1 - alpha) * (1 / (rank + 1))\n\n    return sorted(scores.items(), key=lambda x: x[1], reverse=True)\n```\n\n### 2. 重排序（Reranking）\n\n检索后再用交叉编码器精排：\n\n```\n初步检索（向量搜索，召回 20 条）\n        │\n        ▼\n重排序模型（Cross-Encoder，精排 Top 5）\n        │\n        ▼\n返回最相关的 5 条给 LLM\n```\n\n## 练习任务\n\n1. 实现一个基于字符频率的简单向量嵌入函数\n2. 用余弦相似度实现文档检索，测试不同查询的效果\n3. 对比\"按字符切分\"和\"按段落切分\"两种策略的检索效果\n\n## 知识点总结\n\n- RAG = 检索（Retrieval） + 增强（Augmented） + 生成（Generation）\n- 核心流程：文档加载 → 切分 → Embedding → 向量存储 → 检索 → LLM 生成\n- 文档切分是 RAG 质量的关键因素\n- 向量数据库存储和检索高维向量\n- 混合搜索（向量 + 关键词）通常比单一搜索效果更好\n\n\u003e 💡 提示：RAG 的精髓不是\"找到正确答案\"，而是\"提供足够的上下文让 LLM 自己找到正确答案\"。\n"])</script><script>self.__next_f.push([1,"17:Tb03,"])</script><script>self.__next_f.push([1,"# 多 Agent 协作\n\n## 课程简介\n\n单 Agent 有能力和知识边界的限制。多 Agent 协作通过让多个专业化的 Agent 协同工作，可以完成更复杂的任务。本课时将学习多 Agent 架构设计和 Agent 间通信协议。\n\n## 为什么需要多 Agent\n\n### 单 Agent 的局限\n\n| 问题 | 说明 |\n|------|------|\n| 知识局限 | 一个 LLM 无法精通所有领域 |\n| 角色冲突 | 同一个 Agent 难以同时扮演多个专业角色 |\n| 效率低下 | 串行处理复杂任务耗时长 |\n| 缺乏监督 | 单一 Agent 容易产生幻觉或偏离目标 |\n\n### 多 Agent 的优势\n\n```\n单 Agent：一个人做所有事\n  多 Agent：团队协作\n    架构师设计 → 开发者编码 → 测试员验证 → 产品经理验收\n```\n\n## 多 Agent 架构模式\n\n### 1. 层次式（Hierarchical）\n\n```\n        Manager Agent\n        (任务分配与监督)\n       /       |       \\\n   Worker 1   Worker 2   Worker 3\n  (搜索)      (分析)      (写作)\n```\n\n```python\nclass ManagerAgent:\n    def __init__(self, workers):\n        self.workers = workers\n\n    def delegate(self, task):\n        best_worker = self._select_worker(task)\n        result = best_worker.execute(task)\n        return self._review_result(result)\n\n    def _select_worker(self, task):\n        if \"code\" in task.lower():\n            return self.workers[\"developer\"]\n        elif \"design\" in task.lower():\n            return self.workers[\"designer\"]\n        return self.workers[\"general\"]\n```\n\n### 2. 扁平式（Peer-to-Peer）\n\n```\n Agent A ←→ Agent B\n (搜索)     (分析)\n    |         |\n    v         v\n Agent C ←→ Agent D\n (写作)     (审核)\n```\n\n### 3. 管道式（Pipeline）\n\n```\n Agent 1 → Agent 2 → Agent 3 → Agent 4\n (输入)    (处理)    (优化)    (输出)\n```\n\n## Agent 间通信协议\n\n```python\n@dataclass\nclass AgentMessage:\n    sender: str\n    receiver: str\n    message_type: str    # request / response / broadcast\n    content: dict\n    timestamp: str\n    correlation_id: str\n```\n\n## 主流多 Agent 框架\n\n| 框架 | 特点 | 适用场景 |\n|------|------|----------|\n| **CrewAI** | 角色定义简单，流程可视化 | 快速原型 |\n| **AutoGen** | Microsoft 出品，支持多轮对话 | 复杂对话场景 |\n| **LangGraph** | 基于图的状态机，可控性强 | 生产级工作流 |\n\n## 练习任务\n\n1. 设计一个 3-Agent 团队来撰写一篇技术博客\n2. 实现简单的 Agent 消息总线和广播机制\n3. 对比层次式和扁平式架构的优缺点\n\n## 知识点总结\n\n- 多 Agent 通过专业分工提升整体能力\n- 常见架构：层次式、扁平式、管道式\n- CrewAI / AutoGen / LangGraph 是主流框架\n- 通信需要统一的消息格式\n\n\u003e 提示：多 Agent 的核心不是\"更多 Agent\"，而是\"每个 Agent 做自己最擅长的事\"。\n"])</script><script>self.__next_f.push([1,"18:T2202,"])</script><script>self.__next_f.push([1,"# 实战：构建个人助手 Agent\n\n## 课程简介\n\n本课时是智能体开发课程的实战项目，综合运用 ReAct 推理框架、Function Calling 工具调用、记忆系统和 Prompt Engineering，构建一个完整的个人助手 Agent。\n\n## 项目目标\n\n构建一个名为\"小智\"的个人助手，具备以下能力：\n\n| 能力 | 说明 |\n|------|------|\n| 对话交互 | 自然语言问答 |\n| 天气查询 | 查询指定城市的天气 |\n| 待办管理 | 添加、查看、完成待办事项 |\n| 知识问答 | 基于本地知识库回答问题 |\n| 记忆功能 | 记住用户偏好和历史对话 |\n\n## 系统架构\n\n```\n 用户界面 → Agent 核心层 → 工具层\n           (ReAct + 记忆 + 工具调用)\n           → 天气 API / 待办存储 / 知识检索\n```\n\n## 完整代码实现\n\n```python\nfrom dataclasses import dataclass, field\nfrom typing import List, Dict, Optional\nimport json\nimport uuid\nfrom datetime import datetime\n\n# ============================================================\n# 1. 记忆系统\n# ============================================================\n\nclass MemorySystem:\n    \"\"\"记忆系统：管理短期和长期记忆\"\"\"\n\n    def __init__(self):\n        self.short_term: List[Dict] = []\n        self.long_term: Dict = {}\n        self.max_short_term = 20\n\n    def add_message(self, role: str, content: str):\n        self.short_term.append({\n            \"role\": role, \"content\": content,\n            \"timestamp\": datetime.now().isoformat(),\n        })\n        if len(self.short_term) \u003e self.max_short_term:\n            self._summarize_old_messages()\n\n    def remember(self, key: str, value: any):\n        self.long_term[key] = {\n            \"value\": value,\n            \"created_at\": datetime.now().isoformat(),\n        }\n\n    def recall(self, key: str) -\u003e Optional[any]:\n        entry = self.long_term.get(key)\n        return entry[\"value\"] if entry else None\n\n    def get_context(self, max_messages: int = 10) -\u003e List[Dict]:\n        return self.short_term[-max_messages:]\n\n    def _summarize_old_messages(self):\n        old = self.short_term[:10]\n        summary = f\"[早期对话摘要：{len(old)} 条消息已压缩]\"\n        self.short_term = [{\"role\": \"system\", \"content\": summary}] + self.short_term[10:]\n\n\n# ============================================================\n# 2. 工具定义与执行\n# ============================================================\n\nclass Tool:\n    def __init__(self, name, description, parameters, func):\n        self.name = name\n        self.description = description\n        self.parameters = parameters\n        self.func = func\n\nclass ToolRegistry:\n    def __init__(self):\n        self.tools: Dict[str, Tool] = {}\n\n    def register(self, tool: Tool):\n        self.tools[tool.name] = tool\n\n    def get_schema(self) -\u003e List[Dict]:\n        return [\n            {\"name\": t.name, \"description\": t.description, \"parameters\": t.parameters}\n            for t in self.tools.values()\n        ]\n\n    def execute(self, name: str, args: Dict) -\u003e str:\n        if name not in self.tools:\n            return f\"错误：未知工具 {name}\"\n        try:\n            return self.tools[name].func(**args)\n        except Exception as e:\n            return f\"工具执行错误：{str(e)}\"\n\n\n# ============================================================\n# 3. ReAct 推理引擎\n# ============================================================\n\nclass ReActEngine:\n    def __init__(self, llm, tool_registry: ToolRegistry):\n        self.llm = llm\n        self.tools = tool_registry\n        self.max_steps = 5\n\n    def run(self, user_input: str, memory: MemorySystem) -\u003e str:\n        memory.add_message(\"user\", user_input)\n        context = self._build_prompt(user_input, memory)\n\n        for step in range(self.max_steps):\n            response = self.llm.generate(context)\n            thought, action, action_input, answer = self._parse(response)\n\n            if answer:\n                memory.add_message(\"assistant\", answer)\n                return answer\n\n            if action and action_input:\n                observation = self.tools.execute(action, action_input)\n                memory.add_message(\"system\", f\"[{action}] {observation}\")\n                context += f\"\\nThought: {thought}\\nAction: {action}\\nObservation: {observation}\\n\"\n\n        return \"抱歉，我无法完成这个任务。\"\n\n    def _build_prompt(self, user_input: str, memory: MemorySystem) -\u003e str:\n        tool_schemas = json.dumps(self.tools.get_schema(), ensure_ascii=False, indent=2)\n        user_name = memory.recall(\"user_name\") or \"用户\"\n        return f\"\"\"你是小智，一个个人助手。你可以使用以下工具：\n\n{tool_schemas}\n\n请按照以下格式输出：\nThought: 你的思考过程\nAction: 工具名称\nAction Input: {{\"参数名\": \"参数值\"}}\n（如果有答案）\nFinal Answer: 你的回答\n\n当前用户：{user_name}\n对话历史：{json.dumps(memory.get_context(), ensure_ascii=False)}\n\n用户请求：{user_input}\"\"\"\n\n    def _parse(self, text: str):\n        import re\n        thought = re.search(r\"Thought: (.+)\", text)\n        action = re.search(r\"Action: (.+)\", text)\n        action_input = re.search(r\"Action Input: (.+)\", text)\n        answer = re.search(r\"Final Answer: (.+)\", text)\n        return (\n            thought.group(1) if thought else None,\n            action.group(1) if action else None,\n            action_input.group(1) if action_input else None,\n            answer.group(1) if answer else None,\n        )\n\n\n# ============================================================\n# 4. 个人助手 Agent\n# ============================================================\n\nclass PersonalAssistantAgent:\n    def __init__(self, llm):\n        self.memory = MemorySystem()\n        self.tool_registry = ToolRegistry()\n        self.react = ReActEngine(llm, self.tool_registry)\n        self._register_tools()\n\n    def _register_tools(self):\n        self.tool_registry.register(Tool(\n            name=\"get_weather\",\n            description=\"查询指定城市的天气\",\n            parameters={\n                \"type\": \"object\",\n                \"properties\": {\"city\": {\"type\": \"string\"}},\n                \"required\": [\"city\"]\n            },\n            func=lambda city: f\"{city}今天晴天，气温 25度C，微风。\",\n        ))\n        self.tool_registry.register(Tool(\n            name=\"add_todo\",\n            description=\"添加待办事项\",\n            parameters={\n                \"type\": \"object\",\n                \"properties\": {\"task\": {\"type\": \"string\"}},\n                \"required\": [\"task\"]\n            },\n            func=self._add_todo,\n        ))\n        self.tool_registry.register(Tool(\n            name=\"list_todos\",\n            description=\"列出所有待办事项\",\n            parameters={\"type\": \"object\", \"properties\": {}},\n            func=self._list_todos,\n        ))\n\n    def chat(self, user_input: str) -\u003e str:\n        return self.react.run(user_input, self.memory)\n\n    def _add_todo(self, task: str) -\u003e str:\n        todos = self.memory.recall(\"todos\") or []\n        todos.append({\"task\": task, \"done\": False})\n        self.memory.remember(\"todos\", todos)\n        return f\"已添加待办：{task}\"\n\n    def _list_todos(self) -\u003e str:\n        todos = self.memory.recall(\"todos\") or []\n        if not todos:\n            return \"暂无待办事项\"\n        return \"\\n\".join([f\"{'x' if t['done'] else 'o'} {t['task']}\" for t in todos])\n\n\n# ============================================================\n# 5. 使用示例\n# ============================================================\n\n# agent = PersonalAssistantAgent(llm=your_llm)\n# agent.chat(\"你好，我叫小明\")\n# agent.chat(\"北京今天天气怎么样？\")\n# agent.chat(\"帮我记一下：明天下午开会\")\n# agent.chat(\"我有哪些待办？\")\n```\n\n## 项目扩展方向\n\n| 扩展项 | 说明 | 难度 |\n|--------|------|------|\n| Web 界面 | 用 FastAPI + 前端构建聊天界面 | 中等 |\n| 语音交互 | 集成 Whisper + TTS | 中等 |\n| 知识库 RAG | 接入向量数据库 | 中等 |\n| 多 Agent | 增加专业 Agent | 较难 |\n| 持久化存储 | 记忆系统接入数据库 | 简单 |\n\n## 练习任务\n\n1. 运行代码框架，用 Mock LLM 测试完整对话流程\n2. 新增一个\"计算器\"工具\n3. 为 Agent 添加\"记住用户偏好\"的功能\n\n## 知识点总结\n\n- 完整 Agent = ReAct 引擎 + 记忆系统 + 工具层 + LLM\n- 记忆系统分短期（上下文）和长期（持久化）\n- ReAct 循环：用户输入 → 思考 → 行动 → 观察 → 回答\n- \"先跑通最小闭环，再逐步增加能力\"\n\n\u003e 提示：构建 Agent 的最佳方式是先实现简单的对话 + 一个工具，再逐步完善。\n"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"courseId\":2,\"chapterId\":1,\"lessonSlug\":\"2-1\",\"course\":{\"id\":2,\"title\":\"智能体开发\",\"description\":\"从零构建 AI Agent，掌握 LLM 集成、工具调用、记忆系统、多 Agent 协作等核心技术。\",\"icon\":\"🤖\",\"color\":\"#A78BFA\",\"chapters\":[{\"id\":1,\"title\":\"Agent 基础\",\"icon\":\"🤖\",\"lessons\":[{\"id\":\"2-1\",\"courseId\":2,\"chapterId\":1,\"lessonNumber\":1,\"title\":\"AI Agent 概述\",\"description\":\"了解 AI Agent 的定义、分类和发展历程\",\"difficulty\":\"easy\",\"duration\":10,\"contentPath\":\"/src/lib/content/lessons/agent/2-1.md\",\"initialCode\":\"# AI Agent 概述\\n\\n# Agent = 大语言模型 + 规划 + 记忆 + 工具使用\\n\\nprint(\\\"AI Agent 核心组件:\\\")\\nprint(\\\"1. 大语言模型 (LLM) — 推理与决策\\\")\\nprint(\\\"2. 规划 (Planning) — 分解复杂任务\\\")\\nprint(\\\"3. 记忆 (Memory) — 短期/长期记忆\\\")\\nprint(\\\"4. 工具使用 (Tool Use) — 调用外部 API\\\")\",\"expectedOutput\":\"AI Agent 核心组件:\\n1. 大语言模型 (LLM) — 推理与决策\\n2. 规划 (Planning) — 分解复杂任务\\n3. 记忆 (Memory) — 短期/长期记忆\\n4. 工具使用 (Tool Use) — 调用外部 API\",\"hint\":\"AI Agent 与普通聊天机器人的核心区别：Agent 可以自主规划、调用工具、使用记忆。\",\"slug\":\"2-1\"},{\"id\":\"2-2\",\"courseId\":2,\"chapterId\":1,\"lessonNumber\":2,\"title\":\"LLM 基础与 Prompt Engineering\",\"description\":\"理解大语言模型原理，掌握 Prompt 编写技巧\",\"difficulty\":\"easy\",\"duration\":15,\"contentPath\":\"/src/lib/content/lessons/agent/2-2.md\",\"initialCode\":\"# Prompt Engineering 示例\\n\\n# System Prompt 模板\\nsystem_prompt = \\\"\\\"\\\"\\n你是一个专业的 Python 编程助手。\\n请用简洁清晰的方式回答问题。\\n如果涉及代码，请提供可运行的示例。\\n\\\"\\\"\\\"\\n\\n# User Prompt 模板\\nuser_prompt = \\\"\\\"\\\"\\n请解释 Python 中列表和元组的区别。\\n\\\"\\\"\\\"\\n\\nprint(\\\"System Prompt:\\\")\\nprint(system_prompt)\\nprint(\\\"\\\\nUser Prompt:\\\")\\nprint(user_prompt)\",\"expectedOutput\":\"System Prompt:\\n你是一个专业的 Python 编程助手。\\n请用简洁清晰的方式回答问题。\\n如果涉及代码，请提供可运行的示例。\\n\\nUser Prompt:\\n请解释 Python 中列表和元组的区别。\",\"hint\":\"好的 Prompt 应包含：角色定义、任务描述、输出格式要求、示例（Few-shot）。\",\"slug\":\"2-2\"}]},{\"id\":2,\"title\":\"Agent 核心能力\",\"icon\":\"⚡\",\"lessons\":[{\"id\":\"2-3\",\"courseId\":2,\"chapterId\":2,\"lessonNumber\":1,\"title\":\"ReAct 推理框架\",\"description\":\"掌握推理（Reasoning）与行动（Acting）交替的 Agent 模式\",\"difficulty\":\"medium\",\"duration\":15,\"contentPath\":\"/src/lib/content/lessons/agent/2-3.md\",\"initialCode\":\"# ReAct 框架示例\\n\\n# ReAct = Reasoning + Acting\\n# Agent 交替进行思考(Thought)和行动(Action)\\n\\nthoughts = [\\n    \\\"Thought: 用户问北京的天气，我需要查询天气 API\\\",\\n    \\\"Action: 调用 weather_api(city='北京')\\\",\\n    'Observation: {\\\"temp\\\": 25, \\\"condition\\\": \\\"晴天\\\"}',\\n    \\\"Thought: 已获取天气数据，整理成自然语言回复\\\",\\n    \\\"Action: 生成最终回答\\\",\\n    \\\"Answer: 北京今天晴天，气温 25°C\\\",\\n]\\n\\nfor step in thoughts:\\n    print(step)\",\"expectedOutput\":\"Thought: 用户问北京的天气，我需要查询天气 API\\nAction: 调用 weather_api(city='北京')\\nObservation: {\\\"temp\\\": 25, \\\"condition\\\": \\\"晴天\\\"}\\nThought: 已获取天气数据，整理成自然语言回复\\nAction: 生成最终回答\\nAnswer: 北京今天晴天，气温 25°C\",\"hint\":\"ReAct 的核心是让 LLM 交替输出思考过程和具体行动，而非一次性给出答案。\",\"slug\":\"2-3\"},{\"id\":\"2-4\",\"courseId\":2,\"chapterId\":2,\"lessonNumber\":2,\"title\":\"工具调用与 Function Calling\",\"description\":\"让 Agent 具备调用外部工具和 API 的能力\",\"difficulty\":\"medium\",\"duration\":15,\"contentPath\":\"/src/lib/content/lessons/agent/2-4.md\",\"initialCode\":\"# Function Calling 示例\\n\\nimport json\\n\\n# 定义可用工具\\ntools = [\\n    {\\n        \\\"name\\\": \\\"get_weather\\\",\\n        \\\"description\\\": \\\"获取指定城市的天气信息\\\",\\n        \\\"parameters\\\": {\\n            \\\"type\\\": \\\"object\\\",\\n            \\\"properties\\\": {\\n                \\\"city\\\": {\\\"type\\\": \\\"string\\\", \\\"description\\\": \\\"城市名称\\\"}\\n            },\\n            \\\"required\\\": [\\\"city\\\"]\\n        }\\n    },\\n    {\\n        \\\"name\\\": \\\"send_email\\\",\\n        \\\"description\\\": \\\"发送电子邮件\\\",\\n        \\\"parameters\\\": {\\n            \\\"type\\\": \\\"object\\\",\\n            \\\"properties\\\": {\\n                \\\"to\\\": {\\\"type\\\": \\\"string\\\"},\\n                \\\"subject\\\": {\\\"type\\\": \\\"string\\\"},\\n                \\\"body\\\": {\\\"type\\\": \\\"string\\\"}\\n            },\\n            \\\"required\\\": [\\\"to\\\", \\\"subject\\\", \\\"body\\\"]\\n        }\\n    }\\n]\\n\\nprint(\\\"可用工具列表:\\\")\\nfor tool in tools:\\n    print(f\\\"  - {tool['name']}: {tool['description']}\\\")\",\"expectedOutput\":\"可用工具列表:\\n  - get_weather: 获取指定城市的天气信息\\n  - send_email: 发送电子邮件\",\"hint\":\"Function Calling 让 LLM 输出结构化的工具调用请求，而非自由文本。\",\"slug\":\"2-4\"},{\"id\":\"2-5\",\"courseId\":2,\"chapterId\":2,\"lessonNumber\":3,\"title\":\"记忆系统\",\"description\":\"理解短期记忆和长期记忆的设计与实现\",\"difficulty\":\"medium\",\"duration\":15,\"contentPath\":\"/src/lib/content/lessons/agent/2-5.md\",\"initialCode\":\"# Agent 记忆系统设计\\n\\n# 短期记忆：当前对话的上下文\\nshort_term_memory = {\\n    \\\"messages\\\": [\\n        {\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"我叫小明\\\"},\\n        {\\\"role\\\": \\\"assistant\\\", \\\"content\\\": \\\"你好，小明！有什么我可以帮助你的吗？\\\"},\\n    ],\\n    \\\"max_tokens\\\": 4000,\\n}\\n\\n# 长期记忆：持久化的用户信息和历史\\ndef save_long_term_memory(key, value):\\n    memory_db = {\\n        \\\"user_name\\\": \\\"小明\\\",\\n        \\\"preferences\\\": {\\\"language\\\": \\\"中文\\\", \\\"theme\\\": \\\"dark\\\"},\\n        \\\"history\\\": [\\\"询问了 Python 学习路径\\\", \\\"询问了职业规划建议\\\"],\\n    }\\n    memory_db[key] = value\\n    return memory_db\\n\\nprint(\\\"短期记忆消息数:\\\", len(short_term_memory[\\\"messages\\\"]))\\nmemory = save_long_term_memory(\\\"last_topic\\\", \\\"AI Agent 开发\\\")\\nprint(\\\"长期记忆主题:\\\", memory[\\\"last_topic\\\"])\",\"expectedOutput\":\"短期记忆消息数: 2\\n长期记忆主题: AI Agent 开发\",\"hint\":\"短期记忆 = 对话上下文窗口；长期记忆 = 数据库/向量存储。需要定期总结和压缩。\",\"slug\":\"2-5\"},{\"id\":\"2-6\",\"courseId\":2,\"chapterId\":2,\"lessonNumber\":4,\"title\":\"RAG 检索增强生成\",\"description\":\"学习 RAG 原理，让 Agent 基于外部知识库回答问题\",\"difficulty\":\"medium\",\"duration\":15,\"contentPath\":\"/src/lib/content/lessons/agent/2-6.md\",\"initialCode\":\"# RAG (Retrieval-Augmented Generation) 流程\\n\\n# 步骤 1：文档切分\\ndocuments = [\\n    \\\"Python 是一种高级编程语言，由 Guido van Rossum 于 1991 年创建。\\\",\\n    \\\"机器学习是人工智能的一个子领域，专注于让计算机从数据中学习。\\\",\\n    \\\"Transformer 架构是 GPT、BERT 等大语言模型的基础。\\\",\\n]\\n\\nchunks = []\\nfor doc in documents:\\n    # 简单按句切分\\n    sentences = doc.split(\\\"。\\\")\\n    chunks.extend([s.strip() + \\\"。\\\" for s in sentences if s.strip()])\\n\\nprint(f\\\"文档数量: {len(documents)}\\\")\\nprint(f\\\"切分块数: {len(chunks)}\\\")\\nfor i, chunk in enumerate(chunks):\\n    print(f\\\"  块{i+1}: {chunk[:40]}...\\\")\",\"expectedOutput\":\"文档数量: 3\\n切分块数: 3\\n  块1: Python 是一种高级编程语言...\\n  块2: 机器学习是人工智能的一个子领域...\\n  块3: Transformer 架构是 GPT、BERT...\",\"hint\":\"RAG 流程：文档切分 → Embedding → 向量存储 → 检索 → LLM 生成回答。\",\"slug\":\"2-6\"}]},{\"id\":3,\"title\":\"Agent 进阶\",\"icon\":\"🚀\",\"lessons\":[{\"id\":\"2-7\",\"courseId\":2,\"chapterId\":3,\"lessonNumber\":1,\"title\":\"多 Agent 协作\",\"description\":\"学习多 Agent 架构设计和 Agent 间通信协议\",\"difficulty\":\"medium\",\"duration\":20,\"contentPath\":\"/src/lib/content/lessons/agent/2-7.md\",\"initialCode\":\"# 多 Agent 协作示例\\n\\nclass Agent:\\n    def __init__(self, name, role):\\n        self.name = name\\n        self.role = role\\n\\n    def handle(self, task):\\n        return f\\\"[{self.name} ({self.role})] 处理: {task}\\\"\\n\\n# 创建专业 Agent 团队\\nplanner = Agent(\\\"Planner\\\", \\\"任务规划\\\")\\nresearcher = Agent(\\\"Researcher\\\", \\\"信息检索\\\")\\nwriter = Agent(\\\"Writer\\\", \\\"内容撰写\\\")\\nreviewer = Agent(\\\"Reviewer\\\", \\\"质量审查\\\")\\n\\n# 协作流程\\npipeline = [planner, researcher, writer, reviewer]\\n\\nprint(\\\"多 Agent 协作流程:\\\")\\nfor agent in pipeline:\\n    print(agent.handle(\\\"撰写技术博客\\\"))\",\"expectedOutput\":\"多 Agent 协作流程:\\n[Planner (任务规划)] 处理: 撰写技术博客\\n[Researcher (信息检索)] 处理: 撰写技术博客\\n[Writer (内容撰写)] 处理: 撰写技术博客\\n[Reviewer (质量审查)] 处理: 撰写技术博客\",\"hint\":\"多 Agent 模式：规划者分解任务 → 执行者各司其职 → 汇总者整合结果。\",\"slug\":\"2-7\"},{\"id\":\"2-8\",\"courseId\":2,\"chapterId\":3,\"lessonNumber\":2,\"title\":\"实战：构建个人助手 Agent\",\"description\":\"综合运用所学知识，构建一个完整的个人助手 Agent\",\"difficulty\":\"hard\",\"duration\":25,\"contentPath\":\"/src/lib/content/lessons/agent/2-8.md\",\"initialCode\":\"# 个人助手 Agent 框架\\n\\nclass PersonalAssistant:\\n    def __init__(self, name):\\n        self.name = name\\n        self.memory = {}\\n        self.tools = [\\\"查天气\\\", \\\"设提醒\\\", \\\"发消息\\\"]\\n\\n    def greet(self):\\n        return f\\\"你好！我是 {self.name}，你的个人助手。\\\"\\n\\n    def list_capabilities(self):\\n        return f\\\"我可以帮你: 查天气、设提醒、发消息\\\"\\n\\n    def process(self, command):\\n        if \\\"天气\\\" in command:\\n            return \\\"正在查询天气...\\\"\\n        elif \\\"提醒\\\" in command:\\n            return \\\"已设置提醒！\\\"\\n        elif \\\"消息\\\" in command:\\n            return \\\"正在发送消息...\\\"\\n        else:\\n            return \\\"抱歉，我不太理解，可以换个说法吗？\\\"\\n\\n# 使用助手\\nassistant = PersonalAssistant(\\\"小智\\\")\\nprint(assistant.greet())\\nprint(assistant.list_capabilities())\\nprint(assistant.process(\\\"今天北京天气怎么样？\\\"))\",\"expectedOutput\":\"你好！我是 小智，你的个人助手。\\n我可以帮你: 查天气、设提醒、发消息\\n正在查询天气...\",\"hint\":\"将 ReAct 模式、工具调用和记忆系统整合到一个完整的 Agent 框架中。\",\"slug\":\"2-8\"}]}]},\"chapter\":\"$4:props:course:chapters:0\",\"lesson\":{\"id\":\"2-1\",\"courseId\":2,\"chapterId\":1,\"lessonNumber\":1,\"title\":\"AI Agent 概述\",\"description\":\"了解 AI Agent 的定义、分类和发展历程\",\"difficulty\":\"easy\",\"duration\":10,\"contentPath\":\"/src/lib/content/lessons/agent/2-1.md\",\"initialCode\":\"# AI Agent 概述\\n\\n# Agent = 大语言模型 + 规划 + 记忆 + 工具使用\\n\\nprint(\\\"AI Agent 核心组件:\\\")\\nprint(\\\"1. 大语言模型 (LLM) — 推理与决策\\\")\\nprint(\\\"2. 规划 (Planning) — 分解复杂任务\\\")\\nprint(\\\"3. 记忆 (Memory) — 短期/长期记忆\\\")\\nprint(\\\"4. 工具使用 (Tool Use) — 调用外部 API\\\")\",\"expectedOutput\":\"AI Agent 核心组件:\\n1. 大语言模型 (LLM) — 推理与决策\\n2. 规划 (Planning) — 分解复杂任务\\n3. 记忆 (Memory) — 短期/长期记忆\\n4. 工具使用 (Tool Use) — 调用外部 API\",\"hint\":\"AI Agent 与普通聊天机器人的核心区别：Agent 可以自主规划、调用工具、使用记忆。\",\"slug\":\"2-1\",\"content\":\"$10\"},\"lessonContents\":{\"2-1\":\"$11\",\"2-2\":\"$12\",\"2-3\":\"$13\",\"2-4\":\"$14\",\"2-5\":\"$15\",\"2-6\":\"$16\",\"2-7\":\"$17\",\"2-8\":\"$18\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\nc:[[\"$\",\"title\",\"0\",{\"children\":\"Python 学习中心\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"边学边练的交互式 Python 学习平台，在浏览器中直接编写和运行 Python 代码\"}],[\"$\",\"meta\",\"2\",{\"name\":\"keywords\",\"content\":\"Python,编程学习,在线编程,Pyodide,交互式学习\"}]]
